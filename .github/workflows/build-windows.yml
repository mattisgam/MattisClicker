name: Bygg Windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg fristående exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --clean --onefile --noconsole --name MattisClicker main.py
      - name: Ladda upp exe som artifact
        uses: actions/upload-artifact@v4
        with:
          name: MattisClicker-Windows
          path: dist/MattisClicker.exe
          if-no-files-found: error
      - name: Skapa GitHub-release för versionstagg
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MattisClicker.exe
            MattisClicker-linux
